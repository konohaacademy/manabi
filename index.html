<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>まなびのテラス</title>
<meta name="theme-color" content="#1A237E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まなびテラス">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!--
  まなびのテラス（juken-plan の生徒の画面）の入口。2026-10-14。

  ■ なぜこのページがあるのか
    生徒の画面は Google Apps Script のウェブアプリで、Google の枠（*.googleusercontent.com の iframe）の中で動く。
    iPhone の LINE・Safari・Chrome は、枠の中の保存を「よそのサイトの保存」として扱い、閉じると捨てる。
    2026-10-13〜14 のログイン19回はほぼ全部が「端末:なし」で、生徒は開くたびにパスワードを入れていた。
    このページは塾の持ち物（GitHub Pages。konohaacademy/manabi へ deploy-manabi-pages.yml が写す）なので、ここに置いた保存は閉じても残る。ウェブアプリをこのページの枠に入れて開き、
    ログインの記録（トークン）と前回の中身をこちらに預かる（juken-plan/Student.html :: jpBridge）。

  ■ やりとり（postMessage）
    中 → ここ  { jp: 'hello' }          預かっているものをください
    ここ → 中  { jp: 'store', items }   預かっているもの全部
    中 → ここ  { jp: 'set', k, v } / { jp: 'del', k }   中で書いた・消したものをそのまま写す
    ⚠ 受けるのは Google の枠（*-script.googleusercontent.com）からで、しかもこのページの中の枠からだけ。
      中の側も送る相手をこのページの origin に縛っている（よそのページに入れられてもトークンは出ない）。

  ■ 通知（2026-10-17。sw.js・push-worker/・juken-plan/Push.gs）
    中 → ここ  { jp: 'who', who }       いまログインしている人（ログインID。講師は頭に T:）。空ならログアウト
    ここ → 中  { jp: 'push', sub, role, fresh }  この端末の通知の宛先。中が受験プランに登録する（同じものは送り直さない）
                                        role … 生徒のIDで入った端末を使うのが「本人」か「保護者」か（帯で選ぶ。2026-10-19）
    ここ → 中  { jp: 'go', go, who, at, reply }  通知を押して開いたとき、開くタブ（講師へは、どの生徒のどこか）
    ・通知を許可するかを聞くのは、このページの帯のボタンから（iPhone は押したその場でないと聞けない。枠の中からは聞けない）
    ・iPhone は「ホーム画面に追加」して開いたときだけ通知が届く。Safari で開いているときは、その手順を帯で出す
  ⚠ このページ自体には個人情報も問題も載っていない。中身は全部ログインの向こう。
  ⚠ konohaacademy.github.io はほかのリポジトリのページ（todai-roadmap）と保存を共有する。だから預かるものは頭に mt: を付ける。
  ⚠ ウェブアプリのURLを変えたら（新しいIDで deploy したら）下の APP も変える。いつもは同じIDへ版を上げるだけなので変わらない。
-->
<style>
  html, body { margin: 0; height: 100%; background: #F7F8FA; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F7F8FA; }
  #slow { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: none;
          font: 14px/1.6 -apple-system, "Hiragino Sans", sans-serif; color: #1B1F24; background: #fff;
          border: 1px solid #E3E6EB; border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  #slow a { color: #1A237E; font-weight: 700; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: none; z-index: 5;
         font: 14px/1.6 -apple-system, "Hiragino Sans", sans-serif; color: #1B1F24; background: #fff;
         border: 1px solid #C5CAE9; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 18px rgba(26,35,126,.18); }
  #bar > b { display: block; margin-bottom: 2px; }
  #bar .b { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
  #bar button { font: inherit; border-radius: 10px; padding: 7px 14px; border: 1px solid #C5CAE9; background: #fff; color: #1A237E; }
  #bar button.go { background: #1A237E; color: #fff; border-color: #1A237E; font-weight: 700; }
  #bar .ios { font-size: 13px; color: #444; }
</style>
</head>
<body>
<iframe id="app" title="まなびのテラス" allow="clipboard-write; fullscreen"></iframe>
<div id="bar" role="dialog" aria-live="polite"></div>
<div id="slow">ひらくのに時間がかかっています。うまく出ないときは
  <a id="direct" target="_top">こちらから開いてください</a>（この場合は毎回ログインが要ります）。</div>
<script>
'use strict';
var APP = 'https://script.google.com/macros/s/AKfycbxf6zCLhxA37h8j6bH7dbJKCdvdZDpEYMCxLGI_uE8UwHg_JSR0yne5YPBRUfNXuSB8bw/exec';
var NS = 'mt:';                                  // このページの保存のうち、中から預かったもの
var GAS_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
var frame = document.getElementById('app');
var hello = false;
var inner = null;                                // 中の画面（hello をくれた枠）
var who = '';                                    // いまログインしている人（中が教えてくれる）
// 通知の公開鍵（push-worker の VAPID。公開してよいもの）。⚠ 変えると登録済みの端末に届かなくなる
var VAPID_PUBLIC = 'BMeubbb4RQuEEMUWBeC08MYKWdDSW6ztpVmiRjoY-O5vhVnrlvdWWzaQvSZH6rH6L0E4qDDveUjYCqwgzfKGMgA';
var UI = 'mtw:';                                 // このページだけの覚え（中へは渡さない）

function ls() { try { return window.localStorage; } catch (e) { return null; } }
function all() {
  var s = ls(), out = {};
  if (!s) return out;
  for (var i = 0; i < s.length; i++) {
    var k = s.key(i);
    if (k && k.indexOf(NS) === 0) out[k.slice(NS.length)] = s.getItem(k);
  }
  return out;
}
function put(k, v) {
  var s = ls();
  if (!s) return;
  try { s.setItem(NS + k, v); return; } catch (e) {}
  // 入らない（容量）→ 前回の中身（jp:c1:…）を捨てて、もう一度。ログインの記録のほうが大事
  try {
    for (var i = s.length - 1; i >= 0; i--) {
      var x = s.key(i);
      if (x && x.indexOf(NS + 'jp:c1:') === 0 && x !== NS + k) s.removeItem(x);
    }
    s.setItem(NS + k, v);
  } catch (e) {}
}
function del(k) { var s = ls(); if (s) try { s.removeItem(NS + k); } catch (e) {} }

window.addEventListener('message', function (e) {
  if (!GAS_ORIGIN.test(e.origin)) return;
  try { if (!e.source || e.source.top !== window) return; } catch (x) { return; }
  var d = e.data || {};
  if (d.jp === 'hello') {
    hello = true;
    document.getElementById('slow').style.display = 'none';
    inner = { win: e.source, origin: e.origin };
    e.source.postMessage({ jp: 'store', items: all() }, e.origin);
    if (goWant) toInner(goWant);
  } else if (d.jp === 'set' && typeof d.k === 'string') put(d.k, String(d.v));
  else if (d.jp === 'del' && typeof d.k === 'string') del(d.k);
  else if (d.jp === 'who') { who = typeof d.who === 'string' ? d.who : ''; pushCheck(); }
});

function toInner(m) { if (inner) try { inner.win.postMessage(m, inner.origin); } catch (e) {} }

// ── 通知 ──────────────────────────────────────
// 通知を押して開いたときのタブ（#go=week&who=…&at=…）。sw.js が開いたページへは、中の画面ができてから渡す
var goWant = goFrom(location.hash);
if (goWant) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
function goFrom(hash) {
  var m = {};
  String(hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) try { m[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) {}
  });
  if (!/^[A-Za-z]{1,20}$/.test(m.go || '')) return null;
  return goMsg(m);
}
function goMsg(m) {
  return { jp: 'go', go: m.go, who: /^[A-Za-z0-9._-]{1,40}$/.test(m.who || '') ? m.who : '',
           at: typeof m.at === 'string' ? m.at.slice(0, 300) : '', reply: m.reply ? 1 : 0 };
}

var pushOk = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
var swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; pushCheck(); }).catch(function () {});
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.mt === 'go' && /^[A-Za-z]{1,20}$/.test(d.go || '')) toInner(goMsg(d));
  });
}

function uiGet(k) { var s = ls(); try { return s ? s.getItem(UI + k) : null; } catch (e) { return null; } }
function uiSet(k, v) { var s = ls(); try { if (s) s.setItem(UI + k, v); } catch (e) {} }
function snoozed(k) { var t = Number(uiGet(k) || 0); return t && Date.now() < t; }
function snooze(k, days) { uiSet(k, String(Date.now() + days * 86400000)); hideBar(); }

function hideBar() { document.getElementById('bar').style.display = 'none'; }
function showBar(html) { var b = document.getElementById('bar'); b.innerHTML = html; b.style.display = 'block'; }

/** ログインした人がいるときに、通知の様子を見て帯を出すか、黙って宛先を中へ渡す。 */
function pushCheck() {
  if (!who) { hideBar(); return; }
  // iPhone の Safari（ホーム画面から開いていない）は通知が届かない。追加の手順を出す
  if (isIOS && !standalone) {
    if (snoozed('a2hs')) return;
    showBar('<b>📲 ホーム画面に追加しよう</b><div class="ios">下の <b>共有ボタン（□に↑）</b> →「<b>ホーム画面に追加</b>」。' +
      'アイコンから開くと、ログインしたままになり、<b>通知</b>も届くようになります。</div>' +
      '<div class="b"><button type="button" onclick="snooze(\'a2hs\', 7)">あとで</button></div>');
    return;
  }
  if (!pushOk || !swReg) return;
  if (Notification.permission === 'granted') { subscribe(false); return; }
  if (Notification.permission === 'denied' || snoozed('ask')) return;
  if (who.indexOf('T:') === 0) {
    showBar('<b>🔔 通知を受け取りませんか？</b><div class="ios">生徒のチェック・写真・過去問のふり返りが届いたときにお知らせします。' +
      '通知から、ひとことを送ったり、その課題のところへすぐ飛べます。</div>' +
      '<div class="b"><button type="button" onclick="snooze(\'ask\', 3)">あとで</button>' +
      '<button type="button" class="go" onclick="askPush(\'\')">受け取る</button></div>');
    return;
  }
  // 生徒のIDで入った端末は、本人か保護者かを選んでもらう（保護者には取り組みの知らせ・今日のようすが届く）
  showBar('<b>🔔 通知を受け取りませんか？</b><div class="ios">この端末を使うのは？<br>' +
    '・<b>本人</b>：新しい課題・今日やること・ランキングなどをお知らせします。<br>' +
    '・<b>保護者の方</b>：課題のチェックや写真を送ったとき・毎晩の「今日のようす」・先生からのひとことをお知らせします。</div>' +
    '<div class="b"><button type="button" onclick="snooze(\'ask\', 3)">あとで</button>' +
    '<button type="button" class="go" onclick="askPush(\'parent\')">保護者の方</button>' +
    '<button type="button" class="go" onclick="askPush(\'student\')">本人</button></div>');
}

/** 帯のボタンから（⚠ 押したその場で聞く。iPhone は待ってからだと聞けない） */
function askPush(role) {
  hideBar();
  if (role) uiSet('role', role);
  var p;
  try { p = Notification.requestPermission(); } catch (e) { return; }
  Promise.resolve(p).then(function (r) { if (r === 'granted') subscribe(true); });
}

function subscribe(fresh) {
  if (!swReg) return;
  swReg.pushManager.getSubscription().then(function (s) {
    return s || swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
  }).then(function (s) {
    // role は帯で選んだもの。⚠ 中の画面で切り替えたあとは、中の覚え（jp:devrole）が優先（fresh のときだけこちら）
    if (s) toInner({ jp: 'push', sub: s.toJSON(), fresh: !!fresh, role: uiGet('role') || '' });
  }).catch(function () {});
}

function b64u(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

frame.src = APP + '?wrap=1';
document.getElementById('direct').href = APP;
// 20秒たっても中から声がかからなければ、直接ひらく道を出す（Google 側の都合で枠に入らない日のため）
setTimeout(function () { if (!hello) document.getElementById('slow').style.display = 'block'; }, 20000);
</script>
</body>
</html>
